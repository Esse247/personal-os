  postgresql_verify: npm run verify:postgresql
  dialect_boundaries: npm run test:dialect-boundaries
  postgresql_ci_contract: npm run validate:postgresql-ci
  all_tests: npm test
  local_demo: npm run demo:verify
  migrate: npm run db:migrate
  fixtures: npm run fixtures:load
  continuity: npm run validate:continuity
  quality: npm run validate:quality
  repository_safety: npm run validate:safety
