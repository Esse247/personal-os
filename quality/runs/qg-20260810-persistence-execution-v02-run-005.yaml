failures:
  - id: PE-F-011
    failure_key: recovery-advisory-lock-unbounded-wait
    discovered_iteration: 0
    criterion_ids: [CAP-007]
    severity: P2
    status: RESOLVED
    attempts: 1
    resolved_iteration: 1
    summary: >-
      Recovery's transaction-scoped PostgreSQL advisory lock has no scoped timeout, so a
      wedged open transaction can leave an operator request waiting indefinitely.
    resolution: >-
      A 500 ms transaction-local lock timeout is isolated by a savepoint. SQLSTATE 55P03
      becomes a typed conflict only after current authorization, with correlated audit and
      no receipt/transition; release permits safe retry with the same key.
    risk_tags: [architecture, agent-autonomy]
