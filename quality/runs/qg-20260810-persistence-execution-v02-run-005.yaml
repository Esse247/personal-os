failures:
  - id: PE-F-011
    failure_key: recovery-advisory-lock-unbounded-wait
    discovered_iteration: 0
    criterion_ids: [CAP-007]
    severity: P2
    status: RESOLVED
    attempts: 1
    resolved_iteration: 1
    summary: >-
      Recovery's transaction-scoped PostgreSQL advisory lock has no scoped timeout, so a
      wedged open transaction can leave an operator request waiting indefinitely.
    resolution: >-
      A 500 ms transaction-local lock timeout is isolated by a savepoint. SQLSTATE 55P03
      becomes a typed conflict only after current authorization, with correlated audit and
      no receipt/transition; release permits safe retry with the same key.
    risk_tags: [architecture, agent-autonomy]
  - id: PE-F-012
    failure_key: recovery-lock-timeout-scope-untranslated-55p03
    discovered_iteration: 2
    criterion_ids: [CAP-007]
    severity: P1
    status: RESOLVED
    attempts: 1
    resolved_iteration: 2
    summary: >-
      A successful advisory-lock savepoint leaked its 500 ms transaction-local timeout.
      Later same-event row contention under a different key escaped as raw SQLSTATE 55P03
      without the required typed result or correlated failure audit.
    resolution: >-
      One scoped lock helper now snapshots and restores the exact prior timeout and bounds
      both recovery lock points. Row contention rolls back only its savepoint, reauthorizes,
      commits the correlated deferral audit, preserves failed state, and permits safe retry.
    risk_tags: [architecture, agent-autonomy, side-effects]
