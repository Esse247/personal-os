  - id: PE-F-004
    failure_key: historical-upgrade-verifier-head-conflict
    discovered_iteration: 3
    criterion_ids: [CAP-001]
    severity: P1
    status: ESCALATED
    attempts: 0
    summary: >-
      The verifier upgrades to accepted v0.1 revision 0005 and then calls fixtures-load,
      whose runtime guard requires current revision 0007, so populated upgrade cannot run.
    risk_tags: [architecture]
  - id: PE-F-005
    failure_key: postgresql-lease-uses-transaction-time
    discovered_iteration: 3
    resolved_iteration: 3
    criterion_ids: [CAP-003, CAP-007, CAP-008, CAP-009]
    severity: P1
    status: RESOLVED
    attempts: 1
    summary: >-
      Transaction-stable CURRENT_TIMESTAMP could let a transaction started before expiry
      record delivery/failure after wall-clock lease expiry.
    resolution: >-
      PostgreSQL fenced updates now compare directly with clock_timestamp(), return the
      database-written transition time, and have robust deliver/failure adversarial tests.
    risk_tags: [architecture, agent-autonomy, side-effects]
  - id: PE-F-006
    failure_key: execution-operator-authority-contract-incomplete
    discovered_iteration: 3
    criterion_ids: [CAP-005, CAP-007]
    severity: P1
    status: ESCALATED
    attempts: 0
    summary: >-
      Execution status/failed reads bypass central policy, while recovery lacks a typed,
      correlated, idempotency-digested application command and durable replay receipt.
    risk_tags: [security, permissions, agent-autonomy, side-effects]
  - id: PE-F-007
    failure_key: claim-transition-preauthorization-label
    discovered_iteration: 3
    criterion_ids: [CAP-007]
    severity: P2
    status: ESCALATED
    attempts: 0
    summary: >-
      Claim history labels the lease mutation allowed before the processor performs its
      first central authorization decision; durable effects remain reauthorized twice.
    risk_tags: [security, permissions, agent-autonomy]
  - id: PE-F-008
    failure_key: handler-effect-envelope-binding-unvalidated
    discovered_iteration: 3
    criterion_ids: [CAP-006, CAP-007]
    severity: P2
    status: ESCALATED
    attempts: 0
    summary: >-
      The processor does not independently bind every handler-produced effect identifier,
      owner, consumer, and event reference back to the claimed envelope.
    risk_tags: [architecture, side-effects]
