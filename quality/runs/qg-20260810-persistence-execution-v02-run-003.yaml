failures:
  - id: PE-F-009
    failure_key: actual-postgresql-ci-run-unavailable
    discovered_iteration: 0
    criterion_ids: [CAP-010]
    severity: P1
    status: ESCALATED
    attempts: 1
    summary: >-
      The PostgreSQL 17 workflow contract is structurally valid and invokes the locally
      proven strict command, but the repository has no remote or actual hosted CI run.
    risk_tags: [architecture]
  - id: PE-F-010
    failure_key: recovery-exact-replay-skips-central-policy
    discovered_iteration: 0
    criterion_ids: [CAP-005, CAP-007]
    severity: P1
    status: RESOLVED
    attempts: 1
    resolved_iteration: 1
    summary: >-
      A matching recovery idempotency receipt is replayed before the current recovery
      policy decision, so revoked authority can still receive the stored command result.
    resolution: >-
      Recovery now takes the transaction-scoped idempotency lock, reauthorizes the current
      resource, and only then reads a receipt. A revoked exact replay returns a
      non-enumerating denial, appends correlated audit evidence, and does not alter or
      disclose the previously stored result.
    risk_tags: [security, permissions, data-access]
  - id: PE-F-007
    failure_key: claim-transition-preauthorization-label
    discovered_iteration: 0
    criterion_ids: [CAP-007]
    severity: P2
    status: ESCALATED
    attempts: 0
    summary: >-
      Claim history labels lease mutation allowed before the processor performs its first
      central authorization decision.
    risk_tags: [security, permissions, agent-autonomy]
  - id: PE-F-008
    failure_key: handler-effect-envelope-binding-unvalidated
    discovered_iteration: 0
    criterion_ids: [CAP-006, CAP-007]
    severity: P2
    status: ESCALATED
    attempts: 0
    summary: >-
      The processor does not independently bind every handler-produced effect identifier,
      owner, consumer, event reference, effect type, and payload to the claimed envelope.
    risk_tags: [architecture, side-effects]
  - id: PE-F-011
    failure_key: recovery-advisory-lock-unbounded-wait
    discovered_iteration: 2
    criterion_ids: [CAP-007]
    severity: P2
    status: ESCALATED
    attempts: 0
    summary: >-
      Recovery's transaction-scoped PostgreSQL advisory lock has no scoped lock timeout,
      so a wedged open transaction could leave an operator request waiting indefinitely
      even though the current lock order has no identified cycle.
    risk_tags: [architecture, agent-autonomy]
