schema_version: 1
policy:
  default: deny
  deny_overrides_allow: true
  client_identity_claims_trusted: false
  household_membership_implies_private_access: false
  unknown_permission: deny_and_audit
  foundation_live_action_max_level: 3

action_levels:
  0: observe_read
  1: analyse_suggest
  2: draft_simulate
  3: reversible_internal_write
  4: external_side_effect
  5: financial_legal_identity_health_or_irreversible

permissions:
  - id: intent.capture.own
    resource: intent
    action: create
    allowed_principals: [user]
    relationship: controller_is_principal
    sensitivity_max: personal
    consent_required: false
    max_action_level: 3
    approval: none
    environments: [development, test]
    audit: required
  - id: intent.read.own
    resource: intent
    action: read
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: controller_or_task_scoped_grant
    sensitivity_max: personal
    consent_required: true_for_delegation
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: required_for_denial
  - id: commitment.read.own
    resource: commitment
    action: read
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: controller_or_task_scoped_grant
    sensitivity_max: personal
    consent_required: true_for_delegation
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: required_for_denial
  - id: commitment.transition.own
    resource: commitment
    action: named_transition
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: controller_or_task_scoped_grant
    sensitivity_max: personal
    consent_required: true_for_delegation
    max_action_level: 3
    approval: command_specific
    environments: [development, test]
    audit: required
  - id: schedule.proposal.read.own
    resource: schedule_proposal
    action: read
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: controller_or_task_scoped_grant
    sensitivity_max: personal
    consent_required: true_for_delegation
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: required_for_denial
  - id: schedule.proposal.decide.own
    resource: schedule_proposal
    action: approve_change_reject
    allowed_principals: [designated_human_user]
    relationship: designated_approver_and_controller
    sensitivity_max: personal
    consent_required: false
    max_action_level: 3
    approval: exact_revision_and_digest
    environments: [development, test]
    audit: required
  - id: finance.transaction.read.own
    resource: financial_transaction
    action: read
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: controller_or_explicit_active_grant
    sensitivity_max: financial
    consent_required: true_for_delegation
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: required_for_denial
  - id: finance.transaction.categorise.own
    resource: financial_transaction
    action: create_classification_revision
    allowed_principals: [user, delegated_chief_of_staff, worker]
    relationship: controller_or_task_scoped_grant
    sensitivity_max: financial
    consent_required: true_for_delegation
    max_action_level: 3
    approval: required_if_manual_override
    environments: [development, test]
    audit: required
  - id: audit.read.authorized
    resource: audit_event
    action: read
    allowed_principals: [user, delegated_chief_of_staff]
    relationship: authorized_for_event_subject
    sensitivity_max: inherited
    consent_required: true_for_delegation
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: required_for_denial
  - id: audit.append.system
    resource: audit_event
    action: append
    allowed_principals: [application_service, worker]
    relationship: same_transaction_as_authorized_command
    sensitivity_max: inherited_redacted
    consent_required: inherited
    max_action_level: 3
    approval: inherited
    environments: [development, test]
    audit: self_recording
  - id: provider.external.execute
    resource: external_provider
    action: side_effect
    allowed_principals: []
    relationship: prohibited_in_foundation_v0_1
    sensitivity_max: none
    consent_required: true
    max_action_level: 4
    approval: explicit_future_policy
    environments: []
    audit: denial_required
  - id: provider.model.interpret.mock.own
    resource: provider_capability
    action: mock_read
    allowed_principals: [delegated_chief_of_staff]
    relationship: controller_is_on_behalf_of_user
    sensitivity_max: personal
    consent_required: false
    max_action_level: 1
    approval: none
    environments: [development, test]
    audit: inherited_from_command
  - id: provider.calendar.availability.read.mock.own
    resource: provider_capability
    action: mock_read
    allowed_principals: [delegated_chief_of_staff]
    relationship: controller_is_on_behalf_of_user
    sensitivity_max: personal
    consent_required: false
    max_action_level: 1
    approval: none
    environments: [development, test]
    audit: inherited_from_command
  - id: provider.banking.transactions.read.synthetic.own
    resource: provider_capability
    action: synthetic_read
    allowed_principals: [fixture_loader]
    relationship: controller_is_on_behalf_of_user
    sensitivity_max: financial
    consent_required: false
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: fixture_import_event
  - id: outbox.event.handle.internal.own
    resource: outbox_event
    action: handle_allowlisted_internal_event
    allowed_principals: [server_created_worker]
    relationship: worker_delegation_matches_controller
    sensitivity_max: personal
    consent_required: inherited_from_authoritative_command_and_rechecked
    max_action_level: 3
    approval: inherited_no_new_authority
    environments: [development, test]
    audit: required
  - id: outbox.event.read.internal.own
    resource: outbox_event
    action: read_local_execution_state
    allowed_principals: [owning_human_operator]
    relationship: controller_is_principal
    sensitivity_max: personal
    consent_required: false
    max_action_level: 0
    approval: none
    environments: [development, test]
    audit: access_log
  - id: outbox.event.recover.internal.own
    resource: outbox_event
    action: start_new_bounded_attempt_cycle
    allowed_principals: [owning_human_operator]
    relationship: controller_is_principal
    sensitivity_max: personal
    consent_required: false
    max_action_level: 3
    approval: explicit_recovery_command_with_reason
    environments: [development, test]
    audit: required
  - id: high_risk.execute
    resource: financial_legal_identity_health_irreversible_action
    action: execute
    allowed_principals: []
    relationship: prohibited_in_foundation_v0_1
    sensitivity_max: none
    consent_required: true
    max_action_level: 5
    approval: explicit_human_reauthentication_future
    environments: []
    audit: denial_required
